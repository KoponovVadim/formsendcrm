{% extends "layout.html" %}
{% block title %}Регистрация{% endblock %}
{% block public_content %}
<div class="login-page d-flex align-items-center justify-content-center min-vh-100 bg-light">
    <div class="card shadow-sm" style="width: 100%; max-width: 420px;">
        <div class="card-body p-4">
            <div class="text-center mb-4">
                <i class="bi bi-grid-1x2-fill text-primary" style="font-size: 2.5rem;"></i>
                <h3 class="mt-2 fw-bold">Регистрация</h3>
            </div>
            {% if error %}
            <div class="alert alert-danger py-2">{{ error }}</div>
            {% endif %}
            <form method="POST" action="/register">
                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control" id="email" name="email" required autofocus>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Пароль</label>
                    <input type="password" class="form-control" id="password" name="password" required>
                </div>
                <div class="mb-3">
                    <label for="password2" class="form-label">Повторите пароль</label>
                    <input type="password" class="form-control" id="password2" name="password2" required>
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2">Зарегистрироваться</button>
            </form>
            <div class="text-center mt-3">
                <a href="/login" class="text-muted small">Уже есть аккаунт? Войти</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
