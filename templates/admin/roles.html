{% extends "layout.html" %}
{% block title %}Роли{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h4 class="fw-bold mb-0"><i class="bi bi-shield-lock me-2"></i>Роли</h4>
</div>

<!-- Create role -->
<div class="card border-0 shadow-sm mb-4">
    <div class="card-header bg-white fw-bold">Создать роль</div>
    <div class="card-body">
        <form method="POST" action="/admin/roles/create" class="row g-2 align-items-end">
            <div class="col-sm-4">
                <label class="form-label">Название</label>
                <input type="text" class="form-control" name="name" required>
            </div>
            <div class="col-sm-5">
                <label class="form-label">Описание</label>
                <input type="text" class="form-control" name="description">
            </div>
            <div class="col-sm-3">
                <button type="submit" class="btn btn-primary w-100">
                    <i class="bi bi-plus-lg me-1"></i>Создать
                </button>
            </div>
        </form>
    </div>
</div>

<!-- Roles list -->
<div class="card border-0 shadow-sm">
    <div class="card-body p-0">
        <div class="table-responsive">
            <table class="table table-hover mb-0">
                <thead class="table-light">
                    <tr>
                        <th>ID</th>
                        <th>Название</th>
                        <th>Описание</th>
                        <th>Действия</th>
                    </tr>
                </thead>
                <tbody>
                    {% for role in roles %}
                    <tr>
                        <td>{{ role.id }}</td>
                        <td><strong>{{ role.name }}</strong></td>
                        <td class="text-muted">{{ role.description }}</td>
                        <td>
                            <a href="/admin/roles/{{ role.id }}" class="btn btn-sm btn-outline-primary">
                                <i class="bi bi-pencil me-1"></i>Права
                            </a>
                            <form method="POST" action="/admin/roles/{{ role.id }}/delete"
                                  class="d-inline"
                                  onsubmit="return confirm('Удалить роль?')">
                                <button class="btn btn-sm btn-outline-danger">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </form>
                        </td>
                    </tr>
                    {% else %}
                    <tr>
                        <td colspan="4" class="text-center text-muted py-3">Нет ролей</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
