<div class="row g-2 align-items-end">
    <div class="col-12 col-md-6">
        <label for="calc-service-search" class="form-label mb-1">Поиск услуги</label>
        <input id="calc-service-search" type="text" class="form-control" placeholder="Поиск...">
    </div>
    <div class="col-12 col-md-6">
        <label for="calc-service-select" class="form-label mb-1">Услуга</label>
        <select id="calc-service-select" class="form-select">
            <option value="">Выберите услугу...</option>
            {% for service in services %}
            <option value="{{ service.id }}">{{ service.name }}</option>
            {% endfor %}
        </select>
    </div>
</div>
