{% if rows %}
<div class="calc-locations-grid">
    {% for location, price, orders_count in rows %}
    <button type="button" class="btn btn-outline-dark text-start calc-location-btn" data-location-id="{{ location.id }}" data-price="{{ price }}">
        <div class="fw-semibold">{{ location.name }}</div>
        <div class="small">{{ price }} RUB</div>
        <div class="small text-muted">{{ orders_count }} заказов</div>
    </button>
    {% endfor %}
</div>
{% else %}
<div class="small text-muted">Для услуги нет цен по точкам.</div>
{% endif %}
