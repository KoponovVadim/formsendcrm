{% extends "layout.html" %}
{% block title %}Калькулятор{% endblock %}
{% block content %}
<div class="calc-pos-page">
    <form id="service-calculator-form" class="calc-pos-form" autocomplete="off">
        <div class="card border-0 shadow-sm mb-2">
            <div class="card-body p-3">
                <div class="row g-2 align-items-end">
                    <div class="col-12 col-md-6 col-xl-4">
                        <label for="calculator-client-phone" class="form-label mb-1">Клиент: телефон</label>
                        <input id="calculator-client-phone" type="text" class="form-control" placeholder="+7..." list="client-phone-suggestions" required>
                        <datalist id="client-phone-suggestions"></datalist>
                    </div>
                    <div class="col-12 col-md-6 col-xl-4">
                        <label for="calculator-client-name" class="form-label mb-1">Имя</label>
                        <input id="calculator-client-name" type="text" class="form-control" placeholder="Имя клиента" required>
                    </div>
                </div>
            </div>
        </div>

        <div class="card border-0 shadow-sm mb-2">
            <div class="card-body p-3">
                <div class="row g-2 align-items-end">
                    <div class="col-12 col-lg-5">
                        <label for="calculator-service-search" class="form-label mb-1">Услуга: быстрый поиск</label>
                        <input id="calculator-service-search" type="text" class="form-control" placeholder="Начните вводить..." list="service-suggestions">
                        <datalist id="service-suggestions"></datalist>
                    </div>
                    <div class="col-12 col-lg-5">
                        <label for="calculator-service" class="form-label mb-1">Выбор услуги</label>
                        <select id="calculator-service" class="form-select" required>
                            <option value="">Выберите услугу...</option>
                        </select>
                    </div>
                    <div class="col-12 col-lg-2">
                        <div class="small text-muted mb-1">Базовая</div>
                        <div id="calculator-base-price" class="calc-base-price">0 RUB</div>
                    </div>
                </div>

                <div class="row g-2 mt-1">
                    <div class="col-12">
                        <div id="calculator-fields" class="calc-fields-shell"></div>
                    </div>
                </div>

                <div class="calc-total-inline mt-2">
                    <span class="text-muted small me-2">Итого:</span>
                    <span id="calculator-total" class="calc-total-value">0 RUB</span>
                </div>
            </div>
        </div>

        <div class="card border-0 shadow-sm mb-5">
            <div class="card-body p-3">
                <div class="row g-2 align-items-end">
                    <div class="col-12 col-lg-6">
                        <label for="calculator-executor" class="form-label mb-1">Исполнитель</label>
                        <select id="calculator-executor" class="form-select">
                            <option value="">Автоназначение</option>
                        </select>
                    </div>
                    <div class="col-12 col-lg-4">
                        <div id="calculator-executor-load" class="small text-muted">Загрузка: -</div>
                    </div>
                    <div class="col-12 col-lg-2 d-grid">
                        <button type="button" id="calculator-autoassign" class="btn btn-outline-secondary">Автоназначить</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="calc-actions-fixed">
            <div class="d-flex flex-wrap align-items-center justify-content-between gap-2">
                <span id="calculator-status" class="small text-muted"></span>
                <button type="button" id="calculator-create-order" class="btn btn-primary btn-lg" disabled>
                    Создать заказ
                </button>
            </div>
        </div>
    </form>
</div>
{% endblock %}
