{% extends "layout.html" %}
{% block title %}Вход{% endblock %}
{% block public_content %}
<div class="login-page d-flex align-items-center justify-content-center min-vh-100 bg-light">
    <div class="card shadow-sm" style="width: 100%; max-width: 420px;">
        <div class="card-body p-4">
            <div class="text-center mb-4">
                <i class="bi bi-grid-1x2-fill text-primary" style="font-size: 2.5rem;"></i>
                <h3 class="mt-2 fw-bold">CRM System</h3>
                <p class="text-muted">Войдите в систему</p>
            </div>
            {% if error %}
            <div class="alert alert-danger py-2">{{ error }}</div>
            {% endif %}
            {% if info %}
            <div class="alert alert-info py-2">{{ info }}</div>
            {% endif %}
            <form method="POST" action="/login">
                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                        <input type="email" class="form-control" id="email" name="email"
                               placeholder="admin@admin.com" required autofocus>
                    </div>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Пароль</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock"></i></span>
                        <input type="password" class="form-control" id="password" name="password"
                               required>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2">
                    <i class="bi bi-box-arrow-in-right me-1"></i> Войти
                </button>
            </form>
            <div class="text-center mt-3">
                <span class="text-muted small">Новый аккаунт создает администратор.</span>
            </div>
        </div>
    </div>
</div>
{% endblock %}
